<div data-modal class="is-hidden modal-window">
    <div class="modal-body">
        <button data-modal-close class="modal-button" type="button">
            <svg width="8" height="8" class="modal-button-icon">
                <use href="./img/icons.svg#icon-button-close"></use>
            </svg>
        </button>
        <p class="text-modal">Leave your contacts and we will call you back</p>
        <form class="forms-body" name="Order-Service-forms">
            <div class="form-group">
                <label class="label-text" for="user-name">Name</label>
                <div class="icon-wrapper">
                    <input class="form-frame" type="text" name="user-name" id="user-name" required />
                    <svg width="18" height="24" class="icon-form"><use href="./img/icons.svg#icon-person"></use></svg>
                </div>
            </div>
            <div class="form-group">
                <label class="label-text" for="user-tel">Phone</label>
                <div class="icon-wrapper">
                    <input class="form-frame" type="tel" name="phone-numer" id="user-tel" required />
                    <svg width="18" height="24" class="icon-form"><use href="./img/icons.svg#icon-phone"></use></svg>
                </div>
            </div>
            <div class="form-group">
                <label class="label-text" for="user-email">Email</label>
                <div class="icon-wrapper">
                    <input class="form-frame" type="email" name="user-email" id="user-email" required />
                    <svg width="18" height="24" class="icon-form"><use href="./img/icons.svg#icon-email"></use></svg>
                </div>
            </div>
            <div class="form-group-area">
                <label class="label-text" for="user-comment">Comment</label>
                <textarea class="text-comment" name="user-comment" id="user-comment" rows="5" placeholder="Text input" required></textarea>                   
            </div>
            <div class="label-checkbox-group">
                <input class="checkbox-privacy-policy visually-hidden" type="checkbox" name="user-privacy" id="user-privacy" value="true" required />
                <label class="label-checkbox" for="user-privacy">
                    <span class="label-checkbox-span"><svg class="label-checkbox-icon" width="10" height="8">
                        <use href="./img/icons.svg#icon-checkbox"></use></svg></span>
                    I accept the terms and conditions of the
                    <a href="#" class="link-privacy-policy">Privacy Policy</a>
                </label>
            </div>
            <button type="submit" class="send-form-button">Send</button>
        </form>        
    </div>    
</div>
